server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 4200m;  # a little above MAX_UPLOAD_MB (4096)

    # Each API container is addressed by its own prefix. The trailing slash on proxy_pass strips it.
    # buffering off keeps server-sent events flowing.
    location /api/uploader2/ {
        proxy_pass http://uploader2:8000/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/uploader/ {
        proxy_pass http://uploader:8000/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/downloader/ {
        proxy_pass http://downloader:8000/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri /index.html;
    }
}
